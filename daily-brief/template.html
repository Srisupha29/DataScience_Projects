<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Morning brief</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Literata:opsz,wght@7..72,400;7..72,600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDF1F4; --rail:#E1E8ED; --ink:#16212C; --muted:#566674; --rule:#C7D2DA;
  --accent:#0B5C99; --gain:#17734F; --loss:#B02E1E; --notice:#8A5A00; --notice-bg:#F6EBCF;
  --serif:"Literata",Georgia,"Times New Roman",serif;
  --sans:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0F1B26; --rail:#0B1520; --ink:#E4ECF2; --muted:#93A5B4; --rule:#25384A;
    --accent:#6CB4EE; --gain:#55C596; --loss:#F08A78; --notice:#F0C36B; --notice-bg:#2B2410;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.6 var(--serif)}
a{color:var(--accent);text-underline-offset:3px}
a:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:2px}

.shell{display:grid;grid-template-columns:15rem minmax(0,1fr);min-height:100vh}
.rail{background:var(--rail);padding:2.5rem 1.5rem;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;font-family:var(--sans)}
.rail .day{font:600 1.75rem/1.1 var(--serif);margin:0}
.rail .date{margin:.35rem 0 2rem;color:var(--muted);font-size:.95rem}
.rail nav{display:flex;flex-direction:column;gap:.15rem}
.rail nav a{display:block;padding:.55rem .85rem;color:var(--muted);text-decoration:none;font-weight:500;border-left:3px solid transparent}
.rail nav a:hover{color:var(--ink)}
.rail nav a[aria-current]{color:var(--ink);font-weight:600;border-left-color:var(--accent)}
.rail .updated{margin-top:auto;color:var(--muted);font-size:.85rem}

main{padding:3.5rem 3rem 5rem;min-width:0}
.col{max-width:41rem}
.tabs .section-title{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.section-title{font:600 1rem/1.3 var(--sans);margin:0 0 1.5rem}
[data-section]+[data-section]{margin-top:4rem}
.tabs [data-section]+[data-section]{margin-top:0}

.lede{font:400 1.75rem/1.35 var(--serif);margin:0 0 2.5rem;max-width:30ch;letter-spacing:-.005em}
.lede + p{margin-top:-1.2rem}
.story{padding:1.6rem 0;border-top:1px solid var(--rule)}
.story h3{font:600 1.3rem/1.3 var(--serif);margin:0 0 .5rem}
.story p{margin:.5rem 0}
.tag{display:inline-block;font:500 .8rem/1 var(--sans);color:var(--muted);border:1px solid var(--rule);border-radius:99px;padding:.3rem .6rem;margin-bottom:.6rem}
.why strong{font-family:var(--sans);font-weight:600;font-size:.95rem}
details{margin:.6rem 0}
summary{cursor:pointer;font:500 .95rem var(--sans);color:var(--accent);list-style:none;display:inline-flex;gap:.45rem;align-items:baseline}
summary::-webkit-details-marker{display:none}
summary::before{content:"+";font-weight:600;width:.8em;text-align:center}
details[open] summary::before{content:"\2212"}
details p{border-left:3px solid var(--rule);padding-left:1rem;margin:.7rem 0 .2rem}
.sources{font:400 .85rem/1.5 var(--sans);color:var(--muted);margin-top:.8rem}
.sources a{margin-left:.7rem}
.sources span{margin-right:-.2rem}

.notice{font:500 .9rem/1.5 var(--sans);background:var(--notice-bg);color:var(--notice);border-left:3px solid var(--notice);padding:.8rem 1rem;margin:0 0 2rem}
.notice p{margin:.15rem 0}
.muted{color:var(--muted);font:400 .9rem/1.5 var(--sans)}
.empty{font:400 1rem/1.5 var(--sans);color:var(--muted);padding:1.5rem 0;border-top:1px solid var(--rule)}

h3.group{font:600 1.05rem/1.3 var(--sans);margin:3rem 0 .9rem}
table{width:100%;border-collapse:collapse;font-family:var(--sans);font-variant-numeric:tabular-nums}
th{font-weight:500;color:var(--muted);text-align:right;font-size:.85rem;padding:.4rem 0}
th:first-child,td:first-child{text-align:left}
td{padding:.55rem 0;border-top:1px solid var(--rule);text-align:right}
.up{color:var(--gain)} .down{color:var(--loss)}

.moves{font-family:var(--sans);font-variant-numeric:tabular-nums}
.move{display:grid;grid-template-columns:3.8rem 1fr 5rem;gap:.2rem .8rem;align-items:center;padding:.45rem 0}
.move b{font-weight:600}
.track{position:relative;height:1.1rem}
.track::before{content:"";position:absolute;left:50%;top:-.35rem;bottom:-.35rem;width:1px;background:var(--rule)}
.bar{position:absolute;top:.15rem;bottom:.15rem;border-radius:2px}
.bar.up{left:50%;background:var(--gain)} .bar.down{right:50%;background:var(--loss)}
.move .val{text-align:right;font-weight:500}
.move .note{grid-column:2 / 4;margin:0;font-size:.85rem;line-height:1.4;color:var(--muted)}
.watch{padding:.9rem 0;border-top:1px solid var(--rule)}
.watch b{font:600 1rem var(--sans)}
.watch p{margin:.2rem 0 0}
.fine{font:400 .85rem/1.5 var(--sans);color:var(--muted);margin:.8rem 0 0}

.lesson p{margin:.6rem 0}
.example{border-left:3px solid var(--rule);padding-left:1rem}
.lesson ul{margin:.5rem 0 0;padding-left:1.2rem}
.lesson li{margin:.25rem 0}

footer{margin-top:4rem;padding-top:1.2rem;border-top:1px solid var(--rule);font:400 .85rem/1.5 var(--sans);color:var(--muted);max-width:41rem}

@media (max-width:820px){
  .shell{display:block}
  .rail{position:sticky;top:0;z-index:2;height:auto;flex-direction:column;padding:.8rem 1rem 0}
  .rail .day{font-size:1.2rem;display:inline}
  .rail .date{display:inline;margin:0 0 0 .5rem;font-size:.9rem}
  .rail nav{flex-direction:row;overflow-x:auto;margin-top:.6rem;gap:0}
  .rail nav a{white-space:nowrap;border-left:0;border-bottom:3px solid transparent;padding:.55rem .65rem}
  .rail nav a[aria-current]{border-bottom-color:var(--accent)}
  .rail .updated{display:none}
  main{padding:1.8rem 1.1rem 4rem}
  .lede{font-size:1.4rem}
}
</style>
</head>
<body>
<div class="shell">
  <header class="rail">
    <p class="day" id="day"></p>
    <p class="date" id="date"></p>
    <nav id="nav" aria-label="Sections">
      <a href="#world">World news</a>
      <a href="#ai">AI news</a>
      <a href="#markets">Markets</a>
      <a href="#reading">DS &amp; ML</a>
    </nav>
    <p class="updated" id="updated"></p>
  </header>
  <main>
    <div class="col" id="content"></div>
    <footer>Built from public news feeds and summarised by Claude. Background context comes from the model's general knowledge, so check the linked sources before relying on anything important.</footer>
  </main>
</div>

<script type="application/json" id="data">__DATA__</script>
<script>
(function(){
  var data = JSON.parse(document.getElementById('data').textContent);
  var S = data.sections || {};
  var nf = new Intl.NumberFormat('en-US', {maximumFractionDigits: 2, minimumFractionDigits: 2});

  function h(tag, attrs){
    var e = document.createElement(tag);
    Object.keys(attrs || {}).forEach(function(k){
      var v = attrs[k];
      if (v === null || v === undefined || v === false) return;
      if (k === 'class') e.className = v; else e.setAttribute(k, v === true ? '' : v);
    });
    Array.prototype.slice.call(arguments, 2).forEach(function add(kid){
      if (kid === null || kid === undefined || kid === false) return;
      if (Array.isArray(kid)) return kid.forEach(add);
      e.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
    });
    return e;
  }
  function safeUrl(x){
    try { var u = new URL(x); return (u.protocol === 'http:' || u.protocol === 'https:') ? u.href : null; }
    catch (err) { return null; }
  }
  function sign(p){ return (p >= 0 ? '+' : '−') + Math.abs(p).toFixed(2) + '%'; }

  function sources(links){
    var seen = {}, out = [];
    (links || []).forEach(function(l){
      var url = safeUrl(l.url);
      if (!url || seen[l.source]) return;
      seen[l.source] = 1;
      out.push(h('a', {href: url, target: '_blank', rel: 'noopener noreferrer', title: l.title}, l.source));
    });
    return out.length ? h('p', {class: 'sources'}, h('span', {}, 'Sources'), out) : null;
  }

  function story(s){
    var body = s.summary || s.what_happened;
    return h('article', {class: 'story'},
      s.tag && h('span', {class: 'tag'}, s.tag),
      h('h3', {}, s.headline),
      body && h('p', {}, body),
      s.story_behind && h('details', {}, h('summary', {}, 'The story behind it'), h('p', {}, s.story_behind)),
      s.why_it_matters && h('p', {class: 'why'}, h('strong', {}, 'Why it matters. '), s.why_it_matters),
      s.takeaway && h('p', {class: 'why'}, h('strong', {}, 'Remember. '), s.takeaway),
      sources(s.links));
  }

  function stories(list, id){
    var nodes = [];
    if (data.summaries && data.summaries[id] === false)
      nodes.push(h('p', {class: 'muted'}, 'Showing headlines only. Summaries were not available for this section today.'));
    if (!list || !list.length)
      nodes.push(h('p', {class: 'empty'}, 'Nothing came through for this section today. If this keeps happening, check the feed list in config.py.'));
    else list.forEach(function(s){ nodes.push(story(s)); });
    return nodes;
  }

  function wrap(id, title, kids){
    return h('section', {id: id, 'data-section': true, 'aria-labelledby': id + '-t'},
      h('h2', {class: 'section-title', id: id + '-t'}, title), kids);
  }

  function world(){
    var d = S.world || {};
    return wrap('world', 'World news', [d.top_line && h('p', {class: 'lede'}, d.top_line), stories(d.stories, 'world')]);
  }
  function ai(){
    var d = S.ai || {};
    return wrap('ai', 'AI news', [d.top_line && h('p', {class: 'lede'}, d.top_line), stories(d.stories, 'ai')]);
  }
  function reading(){
    var d = S.reading || {};
    return wrap('reading', 'Data science and ML reading', [stories(d.stories, 'reading')]);
  }

  function markets(){
    var d = S.markets || {}, kids = [];
    kids.push(d.top_line && h('p', {class: 'lede'}, d.top_line));
    kids.push(d.overview && h('p', {}, d.overview));

    if (d.indices && d.indices.length){
      kids.push(h('h3', {class: 'group'}, 'Indices, commodities and crypto'));
      kids.push(h('table', {},
        h('thead', {}, h('tr', {}, h('th', {scope: 'col'}, 'Market'), h('th', {scope: 'col'}, 'Latest'), h('th', {scope: 'col'}, 'Change'))),
        h('tbody', {}, d.indices.map(function(i){
          return h('tr', {},
            h('td', {}, i.name),
            h('td', {}, nf.format(i.price)),
            h('td', {class: i.pct >= 0 ? 'up' : 'down'}, (i.pct >= 0 ? '▲ ' : '▼ ') + sign(i.pct).slice(1)));
        }))));
      kids.push(h('p', {class: 'fine'}, 'Latest price compared with the previous close. Data from Yahoo Finance can be delayed.'));
    }

    if (d.stocks && d.stocks.length){
      var max = Math.max.apply(null, d.stocks.map(function(s){ return Math.abs(s.pct); })) || 1;
      kids.push(h('h3', {class: 'group'}, 'Your watchlist: biggest moves'));
      kids.push(h('div', {class: 'moves'}, d.stocks.map(function(s){
        var cls = s.pct >= 0 ? 'up' : 'down';
        var note = d.movers_notes && d.movers_notes[s.symbol];
        return h('div', {class: 'move'},
          h('b', {}, s.symbol),
          h('div', {class: 'track', 'aria-hidden': 'true'}, h('div', {class: 'bar ' + cls, style: 'width:' + (Math.abs(s.pct) / max * 50).toFixed(1) + '%'})),
          h('span', {class: 'val ' + cls}, sign(s.pct)),
          note && h('p', {class: 'note'}, note));
      })));
    }

    if (d.watch && d.watch.length){
      kids.push(h('h3', {class: 'group'}, 'Worth researching today'));
      d.watch.forEach(function(w){
        kids.push(h('div', {class: 'watch'}, h('b', {}, w.symbol), h('p', {}, w.why)));
      });
      kids.push(h('p', {class: 'fine'}, 'These are starting points for your own research, not advice to buy or sell. Prices can fall as well as rise.'));
    }

    if (d.stories && d.stories.length){
      kids.push(h('h3', {class: 'group'}, 'In the news'));
      kids.push(stories(d.stories, 'markets'));
    }

    var L = d.lesson;
    if (L && L.title){
      kids.push(h('h3', {class: 'group'}, 'Finance, explained'));
      kids.push(h('div', {class: 'lesson'},
        h('p', {}, h('strong', {}, L.title)),
        L.body && h('p', {}, L.body),
        L.example && h('p', {class: 'example'}, L.example),
        L.look_for && L.look_for.length && h('ul', {}, L.look_for.map(function(x){ return h('li', {}, x); }))));
    }
    return wrap('markets', 'Markets', kids);
  }

  var content = document.getElementById('content');
  if (data.warnings && data.warnings.length){
    content.append(h('div', {class: 'notice', role: 'status'}, data.warnings.map(function(w){ return h('p', {}, w); })));
  }
  [world(), ai(), markets(), reading()].forEach(function(n){ content.append(n); });

  var parts = (data.date_label || '').split(' ');
  document.getElementById('day').textContent = (parts[0] || '').replace(',', '');
  document.getElementById('date').textContent = parts.slice(1).join(' ');
  document.getElementById('updated').textContent = data.generated_at ? 'Updated ' + data.generated_at + ' Bangkok time' : '';

  var ids = ['world', 'ai', 'markets', 'reading'];
  var links = Array.prototype.slice.call(document.querySelectorAll('#nav a'));
  function show(){
    var id = location.hash.slice(1);
    if (ids.indexOf(id) < 0) id = 'world';
    document.documentElement.classList.add('tabs');
    ids.forEach(function(i){ document.getElementById(i).hidden = (i !== id); });
    links.forEach(function(a){
      if (a.hash === '#' + id) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
    });
  }
  window.addEventListener('hashchange', function(){ show(); window.scrollTo(0, 0); });
  show();
})();
</script>
</body>
</html>
